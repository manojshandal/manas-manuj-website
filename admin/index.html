<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>मानस एडमिन पैनल | मानस मनुज</title>
  <link rel="icon" type="image/jpeg" href="../images/author.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@600;700&display=swap" rel="stylesheet">

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    :root {
      --mm-cream: #FDF8EE;
      --mm-card: #FFFDF8;
      --mm-soft: #F4E9D2;
      --mm-maroon: #6B141A;
      --mm-maroon-dark: #480C10;
      --mm-saffron: #D96B16;
      --mm-saffron-hover: #B8550C;
      --mm-gold: #C89B3C;
      --mm-gold-light: #F8DF9C;
      --mm-text: #2C1E18;
      --mm-muted: #5C4940;
      --mm-border: rgba(200, 155, 60, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--mm-cream) !important;
      color: var(--mm-text) !important;
      font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif !important;
    }

    /* --- मुख्य ब्रांडेड हेडर (महरून + सुनहरा) --- */
    [class*="AppHeader-"] {
      background: linear-gradient(90deg, var(--mm-maroon-dark), var(--mm-maroon)) !important;
      border-bottom: 3px solid var(--mm-gold) !important;
      box-shadow: 0 4px 14px rgba(72, 12, 16, 0.22) !important;
      height: auto !important;
      min-height: 58px !important;
      width: 100% !important;
      max-width: 100vw !important;
    }

    [class*="AppHeaderContent"] {
      max-width: 1160px !important;
      width: 100% !important;
      padding: 6px 14px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      flex-wrap: wrap !important;
      gap: 8px !important;
    }

    [class*="AppHeaderNavList"] {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      flex-wrap: wrap !important;
    }

    [class*="AppHeaderNavLink"],
    [class*="AppHeaderButton"],
    [class*="AppHeaderSiteLink"] {
      color: var(--mm-cream) !important;
      font-weight: 600 !important;
      font-size: 0.92rem !important;
      border-radius: 8px !important;
      padding: 7px 12px !important;
      border: 1px solid transparent !important;
      transition: background-color 0.2s ease, color 0.2s ease !important;
    }

    [class*="AppHeaderNavLink"]:hover,
    [class*="AppHeaderButton"]:hover,
    [class*="AppHeaderNavLink"].header-link-active,
    [class*="AppHeaderNavLink"][aria-current="page"] {
      background: rgba(248, 223, 156, 0.16) !important;
      color: var(--mm-gold-light) !important;
      border-color: rgba(200, 155, 60, 0.5) !important;
    }

    [class*="AppHeader"] svg {
      color: var(--mm-gold-light) !important;
    }

    [class*="AppHeader"] button:focus,
    [class*="AppHeader"] a:focus {
      outline: none !important;
      box-shadow: 0 0 0 2px var(--mm-gold) !important;
    }

    /* --- मुख्य पेज कंटेनर और कार्ड्स --- */
    [class*="AppMainContainer"] {
      max-width: 1160px !important;
      width: 100% !important;
      margin: 0 auto !important;
      padding: 18px 14px 48px !important;
    }

    [class*="SidebarContainer"],
    [class*="CollectionTopContainer"],
    [class*="ListCard-"],
    [class*="GridCard-"],
    [class*="ViewControls"] {
      background: var(--mm-card) !important;
      border: 1px solid var(--mm-border) !important;
      border-radius: 14px !important;
      box-shadow: 0 6px 18px rgba(107, 20, 26, 0.06) !important;
    }

    [class*="SidebarHeading"],
    [class*="CollectionTopHeading"] {
      font-family: 'Noto Serif Devanagari', serif !important;
      color: var(--mm-maroon) !important;
      font-weight: 700 !important;
    }

    [class*="SidebarNavLink"].sidebar-active,
    [class*="SidebarNavLink"]:hover {
      background: var(--mm-soft) !important;
      color: var(--mm-maroon) !important;
      border-left: 4px solid var(--mm-saffron) !important;
      border-radius: 0 8px 8px 0 !important;
    }

    [class*="ListCard-"] {
      margin-bottom: 12px !important;
      transition: transform 0.18s ease, border-color 0.18s ease !important;
    }

    [class*="ListCard-"]:hover {
      border-color: var(--mm-saffron) !important;
      transform: translateY(-2px) !important;
    }

    [class*="ListCardLink"] {
      padding: 16px 18px !important;
      font-size: 1.02rem !important;
      font-weight: 600 !important;
      color: var(--mm-text) !important;
    }

    /* --- एडिटर टूलबार (Publish बटन हमेशा साफ़ दिखे) --- */
    [class*="EditorContainer"] {
      min-width: 0 !important;
      width: 100% !important;
      max-width: 100vw !important;
      background: var(--mm-cream) !important;
    }

    [class*="ToolbarContainer"] {
      background: var(--mm-card) !important;
      border-bottom: 2px solid var(--mm-border) !important;
      min-width: 0 !important;
      width: 100% !important;
      max-width: 100vw !important;
      height: auto !important;
      min-height: 60px !important;
      padding: 8px 12px !important;
      display: flex !important;
      flex-wrap: wrap !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 8px !important;
      overflow: visible !important;
      box-shadow: 0 4px 12px rgba(107, 20, 26, 0.08) !important;
    }

    [class*="ToolbarSectionBackLink"] {
      border-right: none !important;
      padding: 6px 10px !important;
      min-width: 0 !important;
      color: var(--mm-maroon) !important;
      background: var(--mm-soft) !important;
      border-radius: 8px !important;
      border: 1px solid var(--mm-border) !important;
    }

    [class*="ToolbarSectionMain"] {
      min-width: 0 !important;
      padding: 0 !important;
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      flex-wrap: wrap !important;
    }

    [class*="ToolbarSectionMeta"] {
      display: none !important;
    }

    /* Publish / Save बटन को आकर्षक भगवा रंग दें */
    [class*="PublishedToolbarButton"],
    [class*="ToolbarDropdown"] button,
    [class*="StyledDropdownButton"] {
      background: var(--mm-saffron) !important;
      color: #ffffff !important;
      border-radius: 8px !important;
      font-weight: 700 !important;
      padding: 0 14px !important;
      height: 38px !important;
      line-height: 38px !important;
      box-shadow: 0 3px 10px rgba(217, 107, 22, 0.3) !important;
    }

    [class*="PublishedToolbarButton"]:hover {
      background: var(--mm-saffron-hover) !important;
    }

    /* --- सिंगल-कॉलम एडिटर फ़ॉर्म --- */
    [class*="EditorInterface"],
    [class*="ViewControls"],
    .SplitPane,
    .Pane1 {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
    }

    .Pane2,
    .Resizer,
    [class*="PreviewPaneContainer"],
    [class*="EditorToggle"] {
      display: none !important;
    }

    [class*="ControlPaneContainer"] {
      width: 100% !important;
      max-width: 820px !important;
      margin: 0 auto !important;
      padding: 18px 14px 90px !important;
    }

    /* फ़ॉर्म लेबल और इनपुट बॉक्स */
    [class*="FieldLabel"] {
      background: var(--mm-maroon) !important;
      color: var(--mm-gold-light) !important;
      font-weight: 600 !important;
      font-size: 0.82rem !important;
      letter-spacing: 0.01em !important;
      padding: 4px 10px !important;
      border-radius: 6px 6px 0 0 !important;
    }

    [class*="ControlContainer"] input[type="text"],
    [class*="ControlContainer"] input[type="url"],
    [class*="ControlContainer"] textarea,
    [class*="ControlContainer"] select {
      background: #ffffff !important;
      border: 1.5px solid var(--mm-border) !important;
      border-radius: 0 8px 8px 8px !important;
      color: var(--mm-text) !important;
      font-family: inherit !important;
      font-size: 0.98rem !important;
      padding: 12px !important;
    }

    [class*="ControlContainer"] input:focus,
    [class*="ControlContainer"] textarea:focus {
      border-color: var(--mm-saffron) !important;
    }

    /* लिस्ट आइटम कार्ड्स (Add Video / Article / Review) */
    [class*="TopBarContainer"] {
      background: var(--mm-soft) !important;
      border-bottom: 1px solid var(--mm-border) !important;
      border-radius: 8px 8px 0 0 !important;
      padding: 8px 10px !important;
    }

    [class*="AddButton"] {
      background: var(--mm-maroon) !important;
      color: var(--mm-gold-light) !important;
      border-radius: 8px !important;
      padding: 6px 12px !important;
      font-weight: 600 !important;
      font-size: 0.85rem !important;
    }

    [class*="ObjectControl"],
    [class*="ListItem"] {
      border-color: var(--mm-border) !important;
      border-radius: 10px !important;
      background: var(--mm-card) !important;
    }

    /* लॉगिन स्क्रीन का प्रोफेशनल लुक */
    [class*="StyledAuthenticationPage"] {
      background: radial-gradient(circle at top, #FFF6E3 0%, var(--mm-soft) 100%) !important;
    }

    [class*="LoginButton"] {
      background: var(--mm-maroon) !important;
      color: var(--mm-gold-light) !important;
      border: 2px solid var(--mm-gold) !important;
      border-radius: 10px !important;
      font-weight: 700 !important;
      padding: 12px 26px !important;
    }

    [class*="GoBackButton"] {
      color: var(--mm-maroon) !important;
      font-weight: 600 !important;
    }

    /* वेबसाइट पर वापस जाने का छोटा फ्लोटिंग बटन */
    .mm-home-fab {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 9999;
      background: var(--mm-maroon);
      color: var(--mm-gold-light);
      border: 1.5px solid var(--mm-gold);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(72, 12, 16, 0.28);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .mm-home-fab:hover {
      background: var(--mm-maroon-dark);
    }

    /* --- मोबाइल रिस्पॉन्सिव फिक्स (850px से छोटे स्क्रीन के लिए) --- */
    @media (max-width: 850px) {
      [class*="CollectionContainer"] {
        display: flex !important;
        flex-direction: column !important;
        gap: 14px !important;
      }

      [class*="SidebarContainer"] {
        position: relative !important;
        top: auto !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 14px !important;
      }

      [class*="CollectionMain"] {
        width: 100% !important;
        max-width: 100% !important;
        padding-left: 0 !important;
        margin: 0 !important;
      }

      [class*="CollectionTopContainer"] {
        padding: 14px !important;
        margin-bottom: 12px !important;
      }

      [class*="CollectionTopRow"] {
        flex-wrap: wrap !important;
        gap: 8px !important;
      }

      [class*="ToolbarSectionBackLink"] p,
      [class*="ToolbarSubSectionFirst"] {
        max-width: 180px !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        white-space: nowrap !important;
      }

      [class*="StyledModal"] {
        width: 96vw !important;
        max-width: 96vw !important;
        height: 88vh !important;
        padding: 14px !important;
      }

      [class*="CardGrid"] {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px !important;
      }
    }
  </style>
</head>
<body>
  <a href="../index.html" class="mm-home-fab" title="मुख्य वेबसाइट पर लौटें">← मानस मनुज वेबसाइट</a>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
